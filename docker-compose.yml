services:
  db:
    image: postgres:16-alpine
    container_name: rbf_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rbf}
      POSTGRES_USER: ${POSTGRES_USER:-rbf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rbf_pass}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rbf_user} -d ${POSTGRES_DB:-rbf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rbf_redis
    ports:
      - "6380:6379"

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rbf_web
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo_users && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60}"
    volumes:
      - ./backend:/app
      - ./backend/scripts/render_pdf.mjs:/opt/pba-renderer/render_pdf.mjs:ro
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-dev-secret-key-dev-secret-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.68.140}
      API_REQUIRE_AUTH: ${API_REQUIRE_AUTH:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rbf_user}:${POSTGRES_PASSWORD:-rbf_pass}@db:5432/${POSTGRES_DB:-rbf}
      REDIS_URL: redis://redis:6379/0
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      API_PAGE_SIZE: ${API_PAGE_SIZE:-50}
      API_THROTTLE_ANON: ${API_THROTTLE_ANON:-120/hour}
      API_THROTTLE_USER: ${API_THROTTLE_USER:-600/hour}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://192.168.68.140:5174}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://192.168.68.140:5174}
      PBA_RENDER_SCRIPT: ${PBA_RENDER_SCRIPT:-/opt/pba-renderer/render_pdf.mjs}
      PBA_CHROME_PATH: ${PBA_CHROME_PATH:-/usr/bin/chromium}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-1}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-1}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rbf_scheduler
    command: sh -c "python manage.py migrate --noinput && python manage.py run_report_scheduler --interval 60"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-dev-secret-key-dev-secret-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.68.140}
      API_REQUIRE_AUTH: ${API_REQUIRE_AUTH:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rbf_user}:${POSTGRES_PASSWORD:-rbf_pass}@db:5432/${POSTGRES_DB:-rbf}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: rbf_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  pgdata:
