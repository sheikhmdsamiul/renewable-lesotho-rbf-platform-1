services:
  db:
    image: postgres:16-alpine
    container_name: rbf_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rbf}
      POSTGRES_USER: ${POSTGRES_USER:-rbf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rbf_user} -d ${POSTGRES_DB:-rbf}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rbf_redis_prod
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/sheikh-samiul/renewable-lesotho-rbf-platform-1-backend:latest
    container_name: rbf_web_prod
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_DEBUG: 0
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1
      API_REQUIRE_AUTH: ${API_REQUIRE_AUTH:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rbf_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rbf}
      REDIS_URL: redis://redis:6379/0
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      API_PAGE_SIZE: ${API_PAGE_SIZE:-50}
      API_THROTTLE_ANON: ${API_THROTTLE_ANON:-120/hour}
      API_THROTTLE_USER: ${API_THROTTLE_USER:-600/hour}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      PBA_RENDER_SCRIPT: ${PBA_RENDER_SCRIPT:-/opt/pba-renderer/render_pdf.mjs}
      PBA_CHROME_PATH: ${PBA_CHROME_PATH:-/usr/bin/chromium}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-1}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-1}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    volumes:
      - ./backend/scripts/render_pdf.mjs:/opt/pba-renderer/render_pdf.mjs:ro
      - ./media:/app/media
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/sheikh-samiul/renewable-lesotho-rbf-platform-1-frontend:latest
    container_name: rbf_nginx_prod
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
